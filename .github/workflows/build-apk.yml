name: Build APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk pocket-studio.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-studio-apk
          path: pocket-studio.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: apk-latest
          name: Pocket Studio APK (latest build)
          prerelease: true
          files: pocket-studio.apk
          body: |
            Signed release APK built automatically from the latest push.

            **Install**: download `pocket-studio.apk` on your Android device,
            open it, and allow installing from this source when prompted.
            Min Android 7.0 (API 24). 100% offline - the app has no internet
            permission.
